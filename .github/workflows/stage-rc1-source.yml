name: Stage exact RC1 corresponding source
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cgh-os-rc1-exact-source-delivery
  cancel-in-progress: false
jobs:
  stage-source:
    if: github.repository == 'JCUSMC8152/cgh-os' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Reproduce signed source bytes and stage delegated parts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, http.client, json, os, pathlib, shutil, subprocess, tarfile, tempfile, time, urllib.parse, urllib.request, collections
          REPO='JCUSMC8152/cgh-os'
          RID=430958740
          TOKEN=os.environ['GH_TOKEN']
          FPR='E634449D990AB9B041DD66469FD257669811E41F'
          EXPECTED_FULL='52a2b3e2e831ac420242eafd7fb2ee004de7e701d735b0713a1f6c816f541960'
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):
            result=super().redirect_request(req,fp,code,msg,headers,newurl)
            if result is not None and urllib.parse.urlsplit(req.full_url).hostname!=urllib.parse.urlsplit(newurl).hostname:result.remove_header('Authorization')
            return result
          opener=urllib.request.build_opener(SafeRedirect())
          def request(url,github=False,octets=False):
           headers={'User-Agent':'CGH-OS-Exact-Source-Delivery'}
           if github:headers['Authorization']='Bearer '+TOKEN;headers['Accept']='application/octet-stream' if octets else 'application/vnd.github+json'
           return opener.open(urllib.request.Request(url,headers=headers),timeout=120)
          def api(path):
           with request('https://api.github.com'+path,True) as r:return json.load(r)
          release=api('/repos/'+REPO+'/releases/'+str(RID))
          assert release['tag_name']=='v0.5.1-rc1' and release['draft'] and release['prerelease']
          assert os.environ['GITHUB_REPOSITORY']==REPO
          assert api('/repos/'+REPO)['private'] is False,'Standard runner must remain on the public repository'
          assets={a['name']:a for a in release['assets']}
          root=pathlib.Path('source-delivery-work');root.mkdir();pool=root/'pool';pool.mkdir()
          def asset_bytes(name):
           with request(assets[name]['url'],True,True) as r:return r.read()
          for name in ['CGH-OS-Release-Key.asc','SHA256SUMS','SHA256SUMS.asc']:
           (root/name).write_bytes(asset_bytes(name))
          with tempfile.TemporaryDirectory() as home:
           os.chmod(home,0o700)
           s=subprocess.run(['gpg','--batch','--homedir',home,'--with-colons','--import-options','show-only','--import',str(root/'CGH-OS-Release-Key.asc')],capture_output=True,text=True,check=True).stdout
           assert [x.split(':')[9] for x in s.splitlines() if x.startswith('fpr:')][0]==FPR
           subprocess.run(['gpg','--batch','--homedir',home,'--import',str(root/'CGH-OS-Release-Key.asc')],capture_output=True,check=True)
           subprocess.run(['gpgv','--keyring',home+'/pubring.kbx',str(root/'SHA256SUMS.asc'),str(root/'SHA256SUMS')],capture_output=True,check=True)
          sums={x.split('  ',1)[1]:x.split('  ',1)[0] for x in (root/'SHA256SUMS').read_text().splitlines()}
          cat_bytes=asset_bytes('UPSTREAM-SOURCE-CATALOG.json')
          assert hashlib.sha256(cat_bytes).hexdigest()==sums['UPSTREAM-SOURCE-CATALOG.json']
          catalog=json.loads(cat_bytes);rows=catalog['files']
          assert len(rows)==6130 and catalog['source_pairs']==1713
          assert len({(x['source'],x['version']) for x in rows})==1713
          unique={x['sha256']:x for x in rows}
          assert shutil.disk_usage('.').free>11*1024**3,'Need 11 GiB free on disposable standard runner'
          def download(item):
           digest,x=item;url=urllib.parse.urlsplit(x['origin'])
           assert url.scheme=='https' and url.hostname=='deb.debian.org'
           p=pool/digest;h=hashlib.sha256();n=0
           with request(x['origin']) as response,p.open('xb') as f:
            while b:=response.read(1024*1024):h.update(b);f.write(b);n+=len(b)
           assert n==x['bytes'] and h.hexdigest()==digest,'Authenticated catalog checksum mismatch'
           return n
          print('Downloading fixed-checksum upstream inputs: '+str(len(unique))+' unique files',flush=True)
          total=0
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as executor:
           for i,future in enumerate(concurrent.futures.as_completed([executor.submit(download,x) for x in unique.items()]),1):
            total+=future.result()
            if i%200==0:print('Verified '+str(i)+' files; '+str(total)+' bytes',flush=True)
          metadata={
           'README.txt':b'CGH OS 0.5.1 RC1 corresponding Debian source: 1713 exact source/version pairs. Files match the authenticated source catalog. These are source distribution archives, not installed OS content. YARA upstream source contains parser-test and fuzzing fixtures; Microsoft Defender quarantines its original archive as Backdoor:Unix/Multiverze. Do not execute test fixtures. No Windows exclusions or quarantine restorations were used. The original Debian source is preserved for reproducibility. See SOURCE-CATALOG.json and SOURCE-SHA256SUMS.\n',
           'SOURCE-CATALOG.json':cat_bytes,
           'SOURCE-SHA256SUMS':''.join(x['sha256']+'  '+x['file']+'\n' for x in rows).encode()
          }
          for name,data in metadata.items():(root/name).write_bytes(data)
          assert [len(metadata[n]) for n in metadata]==[534,2350844,850726]
          counts=collections.Counter(x['sha256'] for x in rows)
          target={2,3,4}
          finished=[]
          def upload_part(p,index,digest,size):
           name=p.name
           assert digest==sums[name]
           if index not in target:
            print('Verified '+name+'; upload remains assigned to existing HP worker',flush=True);return
           current=api('/repos/'+REPO+'/releases/'+str(RID)+'/assets?per_page=100')
           matches=[a for a in current if a['name']==name]
           if matches:
            assert len(matches)==1 and matches[0]['state']=='uploaded' and matches[0]['size']==size and matches[0]['digest']=='sha256:'+digest,'Asset in progress or different; reconcile before any retry'
            finished.append(name);return
           u=urllib.parse.urlsplit(release['upload_url'].split('{')[0]);assert u.scheme=='https' and u.hostname=='uploads.github.com'
           c=http.client.HTTPSConnection(u.hostname,timeout=120)
           c.putrequest('POST',u.path+'?'+urllib.parse.urlencode({'name':name}))
           for k,v in {'Authorization':'Bearer '+TOKEN,'User-Agent':'CGH-OS-Exact-Source-Delivery','Content-Type':'application/octet-stream','Content-Length':str(size)}.items():c.putheader(k,v)
           c.endheaders();h=hashlib.sha256()
           with p.open('rb') as f:
            while b:=f.read(1024*1024):c.send(b);h.update(b)
           r=c.getresponse();data=r.read();status=r.status;c.close()
           assert status==201,'Upload HTTP '+str(status)+'; reconcile uncertain asset before retry'
           result=json.loads(data)
           assert h.hexdigest()==digest and result['state']=='uploaded' and result['size']==size and result['digest']=='sha256:'+digest
           finished.append(name);print('UPLOADED '+name+' '+digest,flush=True)
          class Writer:
           def __init__(self):self.f=None;self.n=0;self.total=0;self.parts=[];self.full=hashlib.sha256()
           def closepart(self):
            if self.f:
             self.f.close();digest=self.h.hexdigest();i=len(self.parts);upload_part(self.p,i,digest,self.n)
             self.parts.append({'file':self.p.name,'bytes':self.n,'sha256':digest});self.p.unlink();self.f=None
           def write(self,data):
            self.full.update(data);self.total+=len(data);v=memoryview(data);offset=0
            while offset<len(v):
             if self.f is None:
              self.p=root/('CGH-OS-0.5.1-RC1-Upstream-Source.tar.part-'+str(len(self.parts)).zfill(3));self.f=self.p.open('xb');self.n=0;self.h=hashlib.sha256()
             chunk=v[offset:offset+min(len(v)-offset,1800*1024*1024-self.n)]
             self.f.write(chunk);self.h.update(chunk);self.n+=len(chunk);offset+=len(chunk)
             if self.n==1800*1024*1024:self.closepart()
            return len(data)
          w=Writer()
          with tarfile.open(fileobj=w,mode='w|',format=tarfile.USTAR_FORMAT) as archive:
           for name in metadata:
            p=root/name;info=tarfile.TarInfo(name);info.size=p.stat().st_size;info.mode=0o644;info.mtime=1793491200
            with p.open('rb') as f:archive.addfile(info,f)
           for i,x in enumerate(rows):
            name=x['file'];assert not name.startswith('/') and '..' not in pathlib.PurePosixPath(name).parts
            p=pool/x['sha256'];info=tarfile.TarInfo(name);info.size=x['bytes'];info.mode=0o644;info.mtime=1793491200
            with p.open('rb') as f:archive.addfile(info,f)
            counts[x['sha256']]-=1
            if counts[x['sha256']]==0:p.unlink()
          w.closepart()
          assert w.total==8609679360 and w.full.hexdigest()==EXPECTED_FULL
          assert len(w.parts)==5 and len(finished)==3
          receipt={'status':'PASS','scope':'Reproduced all five exact signed source-part byte streams; uploaded only delegated parts 002-004 to existing evaluation draft','source_files':6130,'source_version_pairs':1713,'tar_bytes':w.total,'tar_sha256':w.full.hexdigest(),'parts':w.parts,'uploaded_parts':finished,'upstream_fixtures_executed':False,'signing_key_provided':False}
          print(json.dumps(receipt,indent=2),flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('### Exact corresponding-source delivery\n\nReproduced all five signed part checksums and the original complete tar checksum. Uploaded parts 002–004 to the existing evaluation draft. HP worker retains parts 000–001. No signing key, new service, cache or Actions artifact used.\n')
          
          PY
